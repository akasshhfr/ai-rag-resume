# A generic, single database configuration.

[alembic]
# path to migration scripts
script_location = alembic

# template used to generate migration file names
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(rev)s_%%(slug)s

# sys.path to prepend for migration scripts
prepend_sys_path = .

# timezone to use when rendering the date
# within the migration file as well as the filename.
# leave blank for localtime
# timezone =

# the output encoding used when revision files
# are written from script.py.mako
# output_encoding = utf-8

# Database URL — overridden in env.py to use our settings
sqlalchemy.url = postgresql://postgres:postgres@localhost:5432/ai_resume_db


[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
